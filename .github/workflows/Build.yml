name: Build Flutter APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"   # Change if needed
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Rename Universal APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/app-universal-release.apk

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Create ZIP Package
        run: |
          mkdir apk-package

          cp build/app/outputs/flutter-apk/app-universal-release.apk apk-package/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk-package/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk-package/

          cd apk-package
          zip -r HarmonyMusic-APKs.zip .

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Universal-APK
          path: build/app/outputs/flutter-apk/app-universal-release.apk

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMv7-APK
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ARM64-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyMusic-All-APKs
          path: apk-package/HarmonyMusic-APKs.zip
